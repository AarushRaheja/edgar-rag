[project]
name = "edgar-rag"
version = "0.1.0"
description = "Production RAG over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "numpy>=2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# dense retrieval + cross-encoder reranking (pulls in torch)
dense = ["sentence-transformers>=3.0"]

[project.scripts]
edgar-rag = "edgar_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
